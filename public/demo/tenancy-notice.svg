<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-labelledby="t">
  <title id="t">Demo leave and licence vacancy notice</title>
  <rect width="800" height="1000" fill="#fbfaf8"/>
  <rect x="48" y="48" width="704" height="904" fill="#fff" stroke="#d9d4cc"/>
  <text x="400" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#0b1f3a">LEAVE AND LICENCE  NOTICE</text>
  <text x="400" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5c6570">DEMO DOCUMENT  FICTIONAL PARTIES</text>
  <text x="80" y="220" font-family="sans-serif" font-size="16" fill="#1c2430">To: Occupant of Flat 4B, Koramangala, Bengaluru</text>
  <text x="80" y="260" font-family="sans-serif" font-size="16" fill="#1c2430">From: R. Krishnan (owner named in this sample)</text>
  <text x="80" y="320" font-family="sans-serif" font-size="16" fill="#1c2430">The Licensee shall vacate and hand over vacant</text>
  <text x="80" y="348" font-family="sans-serif" font-size="16" fill="#1c2430">possession within fifteen (15) days of this notice.</text>
  <text x="80" y="400" font-family="sans-serif" font-size="16" fill="#1c2430">The security deposit shall be refunded after deduction</text>
  <text x="80" y="428" font-family="sans-serif" font-size="16" fill="#1c2430">of dues and damages, if any. Deposit shown: Rs 60,000.</text>
  <text x="80" y="500" font-family="sans-serif" font-size="14" fill="#5c6570">This page is a picture for the Juris prototype.</text>
  <text x="80" y="528" font-family="sans-serif" font-size="14" fill="#5c6570">It is not a real legal notice.</text>
</svg>
